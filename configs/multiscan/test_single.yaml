# Single scene test configuration for quick testing
experiment:
  name: test_single_1029
  dataset_root: data/multiscan
  scenes:
    - scene_00005_00
  parallel_scenes: 1
  force_parallel: false
  levels:
    - 2
    - 4
    - 6
  tag: tag
  tag_in_path: false
  aggregate_output: false
  output_layout: scene_level
  output_root: ./outputs/experiments/{name}
  frames:
    step: 50

stages:
  gpu: 0
  ssam:
    enabled: true
    ssam_freq: 4
    min_area: 100
    stability_threshold: 1.0
    persist_raw: true
    skip_filtering: false
    add_gaps: true
    fill_area: 500
    append_timestamp: false
    downscale_masks: true
    downscale_ratio: 0.3
    max_masks_per_level: -1
    sam_ckpt: third_party/Semantic-SAM/ckpts/swinl_only_sam_many2many.pth
  filter:
    enabled: true
    min_area: 100
    stability_threshold: 1.0
  tracker:
    enabled: true
    prompt_mode: all_mask
    max_propagate: 30
    iou_threshold: 0.6
    downscale_masks: true
    downscale_ratio: 0.3
    render_viz: false
    sam2_cfg: third_party/Grounded-SAM-2/sam2/configs/sam2.1/sam2.1_hiera_l.yaml
    sam2_ckpt: third_party/Grounded-SAM-2/checkpoints/sam2.1_hiera_large.pt
    comparison_sampling:
      max_frames: 100
    build_sam2_tree: false  # Disable containment tree for quick test
    visualize_sam2_tree: false
  report:
    enabled: false
