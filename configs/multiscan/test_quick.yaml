# Ultra-fast test: Just 2 frames to verify provenance fix
experiment:
  name: test_quick_prov
  dataset_root: data/multiscan
  scenes:
    - scene_00005_01  # Smaller scene
  parallel_scenes: 1
  force_parallel: false
  levels:
    - 2
    - 4
  tag: tag
  tag_in_path: false
  aggregate_output: false
  output_layout: scene_level
  output_root: ./outputs/experiments/{name}
  frames:
    start: 0
    end: 100  # Just 2 frames
    step: 50

stages:
  gpu: 0
  ssam:
    enabled: true
    ssam_freq: 1  # Run SSAM on both frames
    min_area: 100
    stability_threshold: 1.0
    persist_raw: true
    skip_filtering: false
    add_gaps: false  # Disable to save time
    append_timestamp: false
    downscale_masks: true
    downscale_ratio: 0.3
    max_masks_per_level: 100  # Limit to speed up
    sam_ckpt: third_party/Semantic-SAM/ckpts/swinl_only_sam_many2many.pth
  filter:
    enabled: true
    min_area: 100
    stability_threshold: 1.0
  tracker:
    enabled: true
    prompt_mode: all_mask
    max_propagate: 30
    iou_threshold: 0.6
    downscale_masks: true
    downscale_ratio: 0.3
    render_viz: false
    sam2_cfg: third_party/Grounded-SAM-2/sam2/configs/sam2.1/sam2.1_hiera_l.yaml
    sam2_ckpt: third_party/Grounded-SAM-2/checkpoints/sam2.1_hiera_large.pt
    comparison_sampling:
      max_frames: 10
    build_sam2_tree: false
    visualize_sam2_tree: false
  report:
    enabled: false
