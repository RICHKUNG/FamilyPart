# Test configuration to verify gap-fill unique_id fix
# Single scene, minimal frames for quick validation

experiment:
  name: test_gap_fix_1113
  dataset_root: data/multiscan
  scenes: null
  scene_start: scene_00005_00
  scene_end: scene_00005_01  # Only 1 scene
  parallel_scenes: 1
  force_parallel: true
  levels:
    - 1
    - 3
  tag: tag
  tag_in_path: false
  aggregate_output: false
  output_layout: scene_level
  output_root: ./outputs/experiments/{name}
  frames:
    start: 0
    end: 400  # Only first 400 frames (8 SSAM frames @ freq=4, step=50)
    step: 50

stages:
  gpu: 0
  ssam:
    enabled: true
    ssam_freq: 4
    min_area: 500
    stability_threshold: null
    persist_raw: true
    skip_filtering: true
    add_gaps: true  # CRITICAL: Enable gap-fill to test the fix
    fill_area: 500
    append_timestamp: false
    downscale_masks: true
    downscale_ratio: 0.3
    max_masks_per_level: 5000
    cascade_filtering: true
    sam_ckpt: third_party/Semantic-SAM/ckpts/swinl_only_sam_many2many.pth
  filter:
    enabled: true
    min_area: 500
    stability_threshold: 1.0
  tracker:
    enabled: false  # Skip tracking for faster test
  report:
    enabled: false
