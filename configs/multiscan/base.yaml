experiment:
  name: v7_246_ssam4_filter100_fill100_prop10_max3k_a_1
  dataset_root: data/multiscan
  scenes: null
  scene_start: scene_00005_00  
  scene_end: scene_00098_02    
  parallel_scenes: 1
  force_parallel: true  # Match base.yaml: bypass OOM monitoring
  levels:
    - 2
    - 4
    - 6
  tag: tag
  tag_in_path: false
  aggregate_output: false
  output_layout: scene_level
  output_root: ./outputs/experiments/{name}
  frames:
    step: 50

stages:
  gpu: 1
  ssam:
    enabled: true
    ssam_freq: 4
    min_area: 100
    stability_threshold: null  # Don't use stability filtering at SSAM stage
    persist_raw: true
    skip_filtering: true
    add_gaps: true
    fill_area: 100  # Match base.yaml: 5k instead of 10k
    append_timestamp: false
    downscale_masks: true
    downscale_ratio: 0.3  # Match base.yaml: full resolution
    max_masks_per_level: 3000  # Reduced from 10000 to prevent OOM
    cascade_filtering: true  # Enable cascade filtering
    sam_ckpt: third_party/Semantic-SAM/ckpts/swinl_only_sam_many2many.pth
  filter:
    enabled: true
    min_area: 100
    stability_threshold: 1.0  # Post-SSAM filtering (not currently used)
  tracker:
    enabled: true
    prompt_mode: all_mask
    max_propagate: 10  # Limit propagation to reduce GPU memory usage
    iou_threshold: 0.6
    downscale_masks: true
    downscale_ratio: 0.3  # Match base.yaml: full resolution
    render_viz: true
    sam2_cfg: third_party/Grounded-SAM-2/sam2/configs/sam2.1/sam2.1_hiera_l.yaml
    sam2_ckpt: third_party/Grounded-SAM-2/checkpoints/sam2.1_hiera_large.pt
    comparison_sampling:
      max_frames: 300
    # ========================================================================
    # Family Tree Building & Visualization Configuration
    # ========================================================================
    visualize_families: true         # Enable for test runs to verify output
    family_viz:
      num_families: 20                # Reduced from 100 to save memory
      max_frames_per_family: 2       # Reduced from 3 to save memory
      output_subdir: visualizations
      random_seed: 42
      min_levels: 2
    # ========================================================================
  report:
    enabled: true
    name: report.md
    max_width: 640
    record_timings: true
    timing_output: stage_timings.json
    generate_check_report: true
