# Test configuration for automatic level detection
# This tests the pipeline with an experiment that has levels [1, 3, 5] instead of [2, 4, 6]

experiment:
  exp_dir: ./outputs/experiments/test_1108_ssam4_filter500_fill500_propinf_135/scene_00005_00
  scene_path: data/multiscan/scene_00005_00
  aggregation_output_dir: null
  inference_output_dir: null

  # Set to null to trigger auto-detection
  levels: null

  device: cuda:0

aggregation:
  enabled: true
  iou_threshold: 0.8
  area_fraction: 0.002
  area_fraction_per_level: null
  extract_features: false  # Disable for faster testing
  siglip_model: google/siglip-so400m-patch14-384
  pooling_mode: voting

  projection:
    vis_depth_threshold: 0.1
    frequency: 50
    resize_ratio: 0.3
    depth_scale: 1000.0

inference:
  enabled: false  # Skip inference for this test
  strategy: independent
  test_all_strategies: false
  retrieval:
    temperature: 0.2
    min_similarity: 0.05
  pairing:
    containment_threshold: 0.1
    scale_range: [0.001, 0.99]
    use_geometric_score: true
    use_tree_pruning: false
  nms:
    iou_threshold: 0.35
    keep_top_k: 200
  scoring:
    method: weighted_sum
    weights:
      object: 0.4
      part: 0.4
      geometric: 0.2
  formatter:
    use_part_mask: true
    min_mask_size: 10
  independent:
    object_levels: [L1, L3]
    part_levels: [L3, L5]
    top_k_per_level: 100
    retrieval_threshold: 0.2
    min_retrieval_threshold: 0.01
    threshold_backoff_step: 0.03
    fallback_to_topk: true

evaluation:
  enabled: false  # Skip evaluation for this test
  gt_path: null
  query_file: null

logging:
  level: INFO
  save_logs: false
